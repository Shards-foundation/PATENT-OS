name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --engine-strict
      - name: Type check
        run: npm exec -- tsc --noEmit
      - name: Build
        run: |
          npm run build
          if ! grep -Eq '<script[^>]*type="module"[^>]*src="[^"]+"' dist/index.html; then
            echo "::error::The built HTML does not load the application module."
            exit 1
          fi

